{% set name = "yapss" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/y/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f2bdb29ae74c8e9b3e2b0b630e32b301b9b36acc06cd0b5bbdb589e822cb550c

build:
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - casadi >=3.6.0,<=3.7.2
    - scipy
    - mpmath
    - matplotlib-base
    - cyipopt

outputs:
  - name: yapss
    build:
      script: "{{ PYTHON }} -m pip install . --no-deps -vv"
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - hatch-vcs
        - pip
      run:
        - python >={{ python_min }}
        - numpy
        - casadi >=3.6.0,<=3.7.2
        - scipy
        - mpmath
        - matplotlib-base
        - cyipopt
    test:
      source_files:
        - tests/examples/test_hs071.py
      requires:
        - pytest
        - python {{ python_min }}
      commands:
        - pytest tests/
    about:
      home: https://github.com/stevenrhall/yapss
      summary: "A Python package for solving optimal control problems using pseudospectral methods."
      description: |
        YAPSS is a Python package for numerically solving multi-phase optimal control problems using
        pseudospectral methods, similar to the GPOPS-II algorithm. The package supports multiple
        differentiation methods, including automatic differentiation using CasADi, as well as numerical
        derivatives found by central difference methods for problems that cannot be differentiated by
        automatic methods. YAPSS supports multiple collocation methods, including Legendre-Gauss (LG),
        Legendre-Gauss-Radau (LGR), and Legendre-Gauss-Lobatto (LGL) collocation points. The mesh
        structure can be specified by the user to improve the accuracy of the solution.
      license: MIT
      license_file: LICENSE
      doc_url: https://yapss.readthedocs.io
      dev_url: https://github.com/stevenrhall/yapss

  - name: yapss-dev
    build:
      script: "{{ PYTHON }} -m pip install .[dev] --no-deps -vv"
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - hatch-vcs
        - pip
      run:
        # yapss dependencies
        - python >={{ python_min }}
        - {{ pin_subpackage('yapss', exact=True) }}
        # documentation
        - sphinx
        - sphinxcontrib-bibtex
        - sphinx-copybutton
        - sphinx_rtd_theme
        - sphinx-llm
        - myst-parser
        - nbsphinx
        - numpydoc
        - furo
        # notebooks
        - jupyterlab
        - jupyterlab_code_formatter
        - jupyterlab-spellchecker
        - ipython
        - ipykernel
        - nbconvert
        - black-jupyter
        - isort
        - nbwipers
        # development
        - tox
        - pytest
        - pytest-cov
        - pytest-xdist
        - ruff
        - mypy
        - toml
        - lxml
        - pyyaml
        - hatch
        - hatch-vcs
        - pre-commit
        - python-build
    test:
      source_files:
        - tests/examples/test_hs071.py
      requires:
        - pytest
        - python {{ python_min }}
      commands:
        - pytest tests/
    about:
      home: https://github.com/stevenrhall/yapss
      summary: "Development package for YAPSS, including documentation and testing tools."
      license: MIT
      license_file: LICENSE
      doc_url: https://yapss.readthedocs.io
      dev_url: https://github.com/stevenrhall/yapss

about:
  home: https://github.com/stevenrhall/yapss
  summary: "Top-level metadata for YAPSS."
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/stevenrhall/yapss

extra:
  feedstock-name: yapss
  recipe-maintainers:
    - stevenrhall
